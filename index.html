<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <title>myGame</title>
</head>
<body>
    <div class="mainContainer">
        <div class="presentation">
            <div class="title">
                Rock-Paper-Scissors
            </div>
            <div class="subText">
                Made-By-Me
            </div>
        </div>

        <div class="scoreContainer">
            <div>
                <p>you</p>
                <div class="humanPoints">
                
                    0
            
                </div>

            </div>
            
            |

            <div>
                <p>bot</p>
                <div class="botPoints">
                
                    0
                </div>

            </div>
            
        </div>

        <div class="specialContainer">
            <div class="consoleContainer">
                <div class="stats">
                    
                    <div class="console">
                        <div class="items">

                        </div>
                        
                    </div>

                    <div class="choice">
                        <button class="terminalButton bracket" id="rock">Rock</button>
                        <button class="terminalButton bracket" id="paper">Paper</button>
                        <button class="terminalButton bracket" id="scissors">Scissors</button>

                    </div>

                    
        
                </div>

            </div>

        </div>

        
        
    </div>
    <script src="rock-paper.js" defer></script>
</body>
</html>
